          {
            "@type": "Question",
            "name": "¿Cuál es la zona de cobertura?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Operamos en Duitama, Paipa y Sogamoso de forma estándar. Para municipios cercanos de Boyacá se cotiza un recargo por desplazamiento."
            }
          },
          {
            "@type": "Question",
            "name": "¿Qué formas de pago aceptan?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Recibimos transferencia (Nequi, Daviplata, Bancolombia), efectivo y pagos con tarjeta. Se confirma la reserva con un abono del 50%."
            }
          },
          {
            "@type": "Question",
            "name": "¿Puedo pedir canciones específicas?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "¡Claro! Nuestro repertorio incluye más de 300 canciones (mariachi, bolero, balada, ranchera, moderna). Si quieres una canción especial fuera del repertorio, la preparamos con aviso previo."
            }
          },
          {
            "@type": "Question",
            "name": "¿Qué pasa si necesito reprogramar?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Puedes reprogramar hasta 24 horas antes sin costo adicional, sujeto a disponibilidad. Cancelaciones dentro de 24h tienen un costo administrativo."
            }
          },
          {
            "@type": "Question",
            "name": "¿Cuánto dura una serenata o show?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Los paquetes estándar van de 20 a 45 minutos. Para eventos podemos ofrecer sets de 1, 2 o 3 horas, con intermedios si se requiere."
            }
          },
          {
            "@type": "Question",
            "name": "¿Incluye sonido y luces?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Los paquetes de serenata incluyen instrumentos acústicos. Para eventos y Experiencias VIP incluimos sonido profesional, luces y en algunos casos video."
            }
          },

            "@type": "Question",
            "name": "¿Atienden eventos corporativos y bodas?",
